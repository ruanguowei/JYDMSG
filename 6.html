<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能排版设计</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a1a;
            font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mobile-frame {
            position: relative;
            display: flex;
            width: 844px;
            height: 390px; 
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* 通用样式 */
        .visual-area {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }
        .artwork-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .artwork-img.active { opacity: 1; }
        
        .content-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 25px;
            transition: all 0.5s ease;
        }
        .template-number {
            font-size: 10px;
            margin-bottom: 8px;
            font-family: monospace;
            opacity: 0.5;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 6px;
            transition: color 0.5s;
        }
        .artist {
            font-size: 12px;
            margin-bottom: 12px;
            opacity: 0.7;
        }
        .text-content {
            font-size: 11px;
            line-height: 1.7;
            opacity: 0.8;
        }
        .footer-meta {
            font-size: 10px;
            margin-top: auto;
            display: flex;
            gap: 8px;
            opacity: 0.5;
        }

        /* 布局类型 */
        .layout-horizontal { flex-direction: row; }
        .layout-horizontal-reverse { flex-direction: row-reverse; }
        .layout-vertical { flex-direction: column; }
        .layout-vertical-reverse { flex-direction: column-reverse; }

        /* 水平布局 - 图片区域大小 */
        .layout-horizontal .visual-area,
        .layout-horizontal-reverse .visual-area { flex: 0 0 75%; padding: 20px; }
        .layout-horizontal .content-area,
        .layout-horizontal-reverse .content-area { flex: 1; }

        /* 垂直布局 - 图片区域大小 */
        .layout-vertical .visual-area,
        .layout-vertical-reverse .visual-area { flex: 0 0 82%; width: 100%; }
        .layout-vertical .content-area,
        .layout-vertical-reverse .content-area { 
            flex: 1; flex-direction: row; align-items: center; 
            padding: 10px 30px; gap: 20px; 
        }
        .layout-vertical .title,
        .layout-vertical-reverse .title { margin: 0; font-size: 16px; white-space: nowrap; }
        .layout-vertical .artist,
        .layout-vertical-reverse .artist { margin: 0; }
        .layout-vertical .description-box,
        .layout-vertical-reverse .description-box { display: none; }

        /* 竖图特殊处理 - 更大的图片区域 */
        .layout-horizontal.portrait-img .visual-area,
        .layout-horizontal-reverse.portrait-img .visual-area { flex: 0 0 55%; }

        /* 信息面板 */
        .info-panel {
            margin-top: 25px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px 30px;
            color: #fff;
            display: flex;
            gap: 40px;
            font-size: 13px;
            max-width: 844px;
            width: 100%;
        }
        .info-group { display: flex; flex-direction: column; gap: 5px; }
        .info-label { font-size: 10px; opacity: 0.5; text-transform: uppercase; }
        .info-value { font-weight: 500; }
        .color-preview {
            width: 60px; height: 30px; border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* 控件样式 */
        .control-panel {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn.primary:hover { transform: scale(1.02); }

        .style-label {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 6px 14px;
            font-size: 11px;
            border-radius: 15px;
            z-index: 999;
            backdrop-filter: blur(10px);
        }

        /* 文件上传区域 */
        .upload-area {
            margin-bottom: 25px;
            padding: 20px 40px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .upload-area:hover {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
        }
        .upload-area input { display: none; }
    </style>
</head>
<body>

    <label class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*">
        <span>点击或拖拽上传图片 - 自动分析并生成最佳排版</span>
    </label>

    <div class="mobile-frame layout-horizontal" id="frame">
        <div class="style-label" id="styleName">自动布局</div>
        <div class="visual-area" id="visualArea">
            <img id="artImg" class="artwork-img active" src="1760167901724_wank0psj78b.jpg" alt="Artwork">
        </div>

        <div class="content-area" id="contentArea">
            <span class="template-number" id="templateNum">智能排版</span>
            <div class="header-group">
                <h1 class="title" id="titleEl">《她.相拥》</h1>
                <span class="artist">李启秀 / 2024</span>
            </div>
            
            <div class="description-box">
                <p class="text-content">
                    作品采用泥条盘筑的手法，勾勒出一群相互拥抱的女性形象。
                </p>
            </div>

            <div class="footer-meta">
                <span>泥条盘筑</span>
                <span>•</span>
                <span>180×50cm</span>
                <span>•</span>
                <span>陶瓷</span>
            </div>
        </div>
    </div>

    <div class="info-panel" id="infoPanel">
        <div class="info-group">
            <span class="info-label">图片尺寸</span>
            <span class="info-value" id="infoSize">--</span>
        </div>
        <div class="info-group">
            <span class="info-label">宽高比</span>
            <span class="info-value" id="infoRatio">--</span>
        </div>
        <div class="info-group">
            <span class="info-label">图片类型</span>
            <span class="info-value" id="infoType">--</span>
        </div>
        <div class="info-group">
            <span class="info-label">主色调</span>
            <div class="color-preview" id="colorPreview"></div>
        </div>
        <div class="info-group">
            <span class="info-label">亮度</span>
            <span class="info-value" id="infoBrightness">--</span>
        </div>
        <div class="info-group">
            <span class="info-label">推荐布局</span>
            <span class="info-value" id="infoLayout">--</span>
        </div>
    </div>

    <div class="control-panel">
        <div class="btn primary" onclick="autoDesign()">🎨 重新自动设计</div>
        <div class="btn" onclick="toggleLayout()">切换布局方向</div>
        <div class="btn" onclick="randomColor()">随机配色</div>
    </div>

    <script>
        const frame = document.getElementById('frame');
        const imgEl = document.getElementById('artImg');
        const visualArea = document.getElementById('visualArea');
        const contentArea = document.getElementById('contentArea');
        const titleEl = document.getElementById('titleEl');
        const styleName = document.getElementById('styleName');
        const templateNum = document.getElementById('templateNum');

        // 图片分析数据
        let imageData = {
            width: 0,
            height: 0,
            ratio: 1,
            dominantColor: '#888888',
            brightness: 128,
            isPortrait: false,
            isSquare: false,
            isWide: false
        };

        // 文件上传处理
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'rgba(255,255,255,0.6)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'rgba(255,255,255,0.2)';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'rgba(255,255,255,0.2)';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                imgEl.src = e.target.result;
                imgEl.onload = () => {
                    analyzeImage();
                };
            };
            reader.readAsDataURL(file);
        }

        // 分析图片
        function analyzeImage() {
            const img = imgEl;
            imageData.width = img.naturalWidth;
            imageData.height = img.naturalHeight;
            imageData.ratio = img.naturalWidth / img.naturalHeight;
            
            // 判断图片类型
            if (imageData.ratio > 1.3) {
                imageData.isWide = true;
                imageData.isPortrait = false;
                imageData.isSquare = false;
            } else if (imageData.ratio < 0.77) {
                imageData.isPortrait = true;
                imageData.isWide = false;
                imageData.isSquare = false;
            } else {
                imageData.isSquare = true;
                imageData.isPortrait = false;
                imageData.isWide = false;
            }

            // 提取主色调
            extractDominantColor(img);
        }

        // 提取主色调（使用Canvas采样）
        function extractDominantColor(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 50; // 采样尺寸
            canvas.width = size;
            canvas.height = size;
            
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;
            
            let r = 0, g = 0, b = 0, count = 0;
            
            // 采样中心区域
            for (let y = 10; y < 40; y++) {
                for (let x = 10; x < 40; x++) {
                    const idx = (y * size + x) * 4;
                    r += data[idx];
                    g += data[idx + 1];
                    b += data[idx + 2];
                    count++;
                }
            }
            
            r = Math.round(r / count);
            g = Math.round(g / count);
            b = Math.round(b / count);
            
            imageData.dominantColor = `rgb(${r}, ${g}, ${b})`;
            imageData.brightness = (r * 299 + g * 587 + b * 114) / 1000;
            
            // 自动应用设计
            autoDesign();
        }

        // 自动设计
        function autoDesign() {
            // 1. 根据宽高比选择布局
            let layoutClass = 'layout-horizontal';
            let layoutName = '左图右文';
            
            if (imageData.isWide) {
                // 宽图：使用上下布局
                layoutClass = Math.random() > 0.5 ? 'layout-vertical' : 'layout-vertical-reverse';
                layoutName = layoutClass === 'layout-vertical' ? '上图下文' : '下图上文';
            } else if (imageData.isPortrait) {
                // 竖图：使用左右布局，图片区域小一些
                layoutClass = Math.random() > 0.5 ? 'layout-horizontal' : 'layout-horizontal-reverse';
                layoutName = layoutClass === 'layout-horizontal' ? '左图右文' : '右图左文';
            } else {
                // 方图：随机左右布局
                layoutClass = Math.random() > 0.5 ? 'layout-horizontal' : 'layout-horizontal-reverse';
                layoutName = layoutClass === 'layout-horizontal' ? '左图右文' : '右图左文';
            }

            // 应用布局
            frame.className = 'mobile-frame ' + layoutClass;
            if (imageData.isPortrait) {
                frame.classList.add('portrait-img');
            }

            // 2. 根据主色调生成配色方案
            const colors = generateColorScheme(imageData.dominantColor, imageData.brightness);
            
            // 应用配色
            frame.style.background = colors.background;
            visualArea.style.background = colors.visualBg;
            contentArea.style.background = colors.contentBg;
            contentArea.style.color = colors.text;
            titleEl.style.color = colors.title;

            // 3. 更新信息面板
            updateInfoPanel(layoutName);
            
            // 更新标签
            styleName.textContent = `自动 · ${layoutName}`;
            templateNum.textContent = imageData.brightness > 128 ? '浅色主题' : '深色主题';

            // 图片淡入效果
            imgEl.classList.remove('active');
            setTimeout(() => imgEl.classList.add('active'), 100);
        }

        // 生成配色方案
        function generateColorScheme(dominantColor, brightness) {
            // 解析RGB
            const rgb = dominantColor.match(/\d+/g).map(Number);
            const [r, g, b] = rgb;
            
            // 计算HSL
            const hsl = rgbToHsl(r, g, b);
            
            let scheme = {};
            
            if (brightness > 140) {
                // 亮色图片 - 使用浅色背景
                scheme = {
                    background: `hsl(${hsl.h}, ${Math.min(hsl.s, 15)}%, 97%)`,
                    visualBg: `hsl(${hsl.h}, ${Math.min(hsl.s, 20)}%, 94%)`,
                    contentBg: 'transparent',
                    text: `hsl(${hsl.h}, ${Math.min(hsl.s, 30)}%, 35%)`,
                    title: `hsl(${hsl.h}, ${Math.min(hsl.s + 10, 40)}%, 25%)`
                };
            } else if (brightness < 80) {
                // 暗色图片 - 使用深色背景
                scheme = {
                    background: `hsl(${hsl.h}, ${Math.min(hsl.s, 20)}%, 12%)`,
                    visualBg: `hsl(${hsl.h}, ${Math.min(hsl.s, 15)}%, 8%)`,
                    contentBg: 'transparent',
                    text: `hsl(${hsl.h}, ${Math.min(hsl.s, 15)}%, 75%)`,
                    title: `hsl(${hsl.h}, ${Math.min(hsl.s, 20)}%, 95%)`
                };
            } else {
                // 中等亮度 - 使用柔和配色
                scheme = {
                    background: `hsl(${hsl.h}, ${Math.min(hsl.s, 25)}%, 95%)`,
                    visualBg: `hsl(${hsl.h}, ${Math.min(hsl.s, 30)}%, 90%)`,
                    contentBg: 'transparent',
                    text: `hsl(${hsl.h}, ${Math.min(hsl.s, 25)}%, 40%)`,
                    title: `hsl(${hsl.h}, ${Math.min(hsl.s + 15, 50)}%, 30%)`
                };
            }
            
            return scheme;
        }

        // RGB转HSL
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        // 更新信息面板
        function updateInfoPanel(layoutName) {
            document.getElementById('infoSize').textContent = `${imageData.width} × ${imageData.height}`;
            document.getElementById('infoRatio').textContent = imageData.ratio.toFixed(2);
            
            let typeText = '方形图';
            if (imageData.isWide) typeText = '横向宽图';
            else if (imageData.isPortrait) typeText = '纵向竖图';
            document.getElementById('infoType').textContent = typeText;
            
            document.getElementById('colorPreview').style.background = imageData.dominantColor;
            document.getElementById('infoBrightness').textContent = 
                imageData.brightness > 140 ? '明亮' : (imageData.brightness < 80 ? '暗沉' : '适中');
            document.getElementById('infoLayout').textContent = layoutName;
        }

        // 切换布局方向
        function toggleLayout() {
            const layouts = ['layout-horizontal', 'layout-horizontal-reverse', 'layout-vertical', 'layout-vertical-reverse'];
            const current = layouts.find(l => frame.classList.contains(l));
            const currentIdx = layouts.indexOf(current);
            const nextIdx = (currentIdx + 1) % layouts.length;
            
            frame.classList.remove(...layouts, 'portrait-img');
            frame.classList.add(layouts[nextIdx]);
            
            const names = ['左图右文', '右图左文', '上图下文', '下图上文'];
            styleName.textContent = `手动 · ${names[nextIdx]}`;
            document.getElementById('infoLayout').textContent = names[nextIdx];
        }

        // 随机配色
        function randomColor() {
            const hue = Math.floor(Math.random() * 360);
            const isLight = Math.random() > 0.5;
            
            if (isLight) {
                frame.style.background = `hsl(${hue}, 20%, 96%)`;
                visualArea.style.background = `hsl(${hue}, 25%, 92%)`;
                contentArea.style.color = `hsl(${hue}, 30%, 35%)`;
                titleEl.style.color = `hsl(${hue}, 40%, 25%)`;
                templateNum.textContent = '浅色主题';
            } else {
                frame.style.background = `hsl(${hue}, 15%, 12%)`;
                visualArea.style.background = `hsl(${hue}, 10%, 8%)`;
                contentArea.style.color = `hsl(${hue}, 15%, 75%)`;
                titleEl.style.color = `hsl(${hue}, 20%, 95%)`;
                templateNum.textContent = '深色主题';
            }
            
            styleName.textContent = `随机配色 · H${hue}°`;
        }

        // 页面加载时分析默认图片
        imgEl.onload = function() {
            if (imgEl.complete && imgEl.naturalWidth > 0) {
                analyzeImage();
            }
        };
        
        // 如果图片已缓存
        if (imgEl.complete && imgEl.naturalWidth > 0) {
            analyzeImage();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') { e.preventDefault(); autoDesign(); }
            if (e.key === 'Tab') { e.preventDefault(); toggleLayout(); }
        });
    </script>
</body>
</html>
